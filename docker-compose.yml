version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prism_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prism_secure_password_2026
      POSTGRES_DB: prism_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prism_backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:prism_secure_password_2026@postgres:5432/prism_db?schema=public"
      JWT_SECRET: "prism_production_super_secret_jwt_key_2026"
      JWT_REFRESH_SECRET: "prism_production_super_secret_refresh_jwt_key_2026"
      FRONTEND_URL: "http://localhost"
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000/api"
    container_name: prism_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
